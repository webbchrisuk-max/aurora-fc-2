name: Aurora Housekeeping 2026-08-19

# One-off housekeeping runner. Updating this file intentionally triggers the correction pass.
on:
  push:
    paths:
      - '.github/workflows/aurora-housekeeping-20260819.yml'

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Aurora shared sources and static HTML plumbing
        shell: python
        run: |
          from pathlib import Path
          import json, re

          repo = Path('.')
          shared_version = '20260819-housekeeping-1'
          badge_old = 'https://webbchrisuk-max.github.io/aurora-city-fc/assets/aurora-city-fc/icons/icon-512.png'
          badge_new = 'assets/aurora-city-fc-badge.svg'

          # 1) Correct every live HTML document's static shell references.
          html_files = [p for p in repo.glob('*.html') if p.name != 'finance-migration.html']
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace(badge_old, badge_new)

              # Canonical Nexus destinations. Preserve login/logout navigation logic elsewhere.
              text = text.replace('href="index.html" title="Nexus HQ"', 'href="AuroraCityFC_NexusV2.html" title="Nexus HQ"')
              text = text.replace('href="index.html" data-name="Nexus HQ 2.0"', 'href="AuroraCityFC_NexusV2.html" data-name="Nexus HQ 2.0"')
              text = text.replace('href="index.html" data-name="Nexus HQ"', 'href="AuroraCityFC_NexusV2.html" data-name="Nexus HQ"')

              # One fresh shared cache key across the club.
              text = re.sub(r'aurora-shell\.css\?v=[^"\']+', f'aurora-shell.css?v={shared_version}', text)
              text = re.sub(r'aurora-page-shell\.js\?v=[^"\']+', f'aurora-page-shell.js?v={shared_version}', text)
              text = re.sub(r'aurora-motion\.css\?v=[^"\']+', f'aurora-motion.css?v={shared_version}', text)
              text = re.sub(r'aurora-motion\.js\?v=[^"\']+', f'aurora-motion.js?v={shared_version}', text)
              text = re.sub(r'aurora-typography\.css\?v=[^"\']+', f'aurora-typography.css?v={shared_version}', text)

              # Start/login page branding only; no authentication behaviour changes.
              if path.name == 'index.html':
                  text = text.replace('<title>Aurora City FC — Nexus HQ 4.5.1</title>', '<title>Aurora City FC — Club Access</title>')
                  text = text.replace('Nexus HQ 4.5.1', 'Nexus Headquarters')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # 2) Scouting must consume the newly restored aurora-fc-2 AuroraMaster export.
          scouting = repo / 'scouting.js'
          text = scouting.read_text(encoding='utf-8')
          text = text.replace(
              'https://webbchrisuk-max.github.io/aurora-city-fc/AuroraMaster.json',
              'https://webbchrisuk-max.github.io/aurora-fc-2/AuroraMaster.json'
          )
          text = text.replace(
              'https://raw.githubusercontent.com/webbchrisuk-max/aurora-city-fc/main/AuroraMaster.json',
              'https://raw.githubusercontent.com/webbchrisuk-max/aurora-fc-2/main/AuroraMaster.json'
          )
          scouting.write_text(text, encoding='utf-8')

          # 3) Shared shell should request the current repaired report feed and release assets.
          shell = repo / 'aurora-page-shell.js'
          text = shell.read_text(encoding='utf-8')
          text = re.sub(r"aurora-release\.js\?v=[^']+", f"aurora-release.js?v={shared_version}", text)
          text = re.sub(r"aurora-club-command\.js\?v=[^']+", f"aurora-club-command.js?v={shared_version}", text)
          text = re.sub(r"match-report-published-feed\.js\?v=[^']+", "match-report-published-feed.js?v=20260819-report-recovery-3", text)
          shell.write_text(text, encoding='utf-8')

          # 4) Synchronise both release manifests.
          release_json = {
              'product': 'Aurora 2.0',
              'release': 'Club Command v1',
              'build': '2026.08.19.1',
              'schemaVersion': 11,
              'syncManagerVersion': 1,
              'platformVersion': 1,
              'releasedAt': '2026-08-19T03:02:00Z',
              'channel': 'stable-candidate'
          }
          (repo / 'aurora-release.json').write_text(json.dumps(release_json, indent=2) + '\n', encoding='utf-8')
          (repo / 'aurora-release.js').write_text("""(function(w){
'use strict';
w.AuroraRelease=Object.freeze({
  product:'Aurora 2.0',
  release:'Club Command v1',
  build:'2026.08.19.1',
  schemaVersion:11,
  syncManagerVersion:1,
  platformVersion:1,
  releasedAt:'2026-08-19T03:02:00Z',
  channel:'stable-candidate'
});
})(window);
""", encoding='utf-8')

          # 5) Guard against regression before committing.
          live_html = '\n'.join(p.read_text(encoding='utf-8') for p in html_files)
          assert badge_old not in live_html, 'Old aurora-city-fc crest URL remains in a live HTML file'
          assert 'aurora-page-shell.js?v=200-stable-core' not in live_html, 'Old shared shell cache key remains'
          assert 'aurora-motion.js?v=20260816-1' not in live_html, 'Old motion cache key remains'

          scout_text = scouting.read_text(encoding='utf-8')
          assert 'webbchrisuk-max.github.io/aurora-city-fc/AuroraMaster.json' not in scout_text
          assert 'raw.githubusercontent.com/webbchrisuk-max/aurora-city-fc/main/AuroraMaster.json' not in scout_text
          assert 'webbchrisuk-max.github.io/aurora-fc-2/AuroraMaster.json' in scout_text

      - name: Show changed files
        run: git status --short

      - name: Commit housekeeping corrections
        run: |
          git config user.name "Aurora City FC Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' '*.js' '*.json'
          if git diff --cached --quiet; then
            echo "No housekeeping changes required."
          else
            git commit -m "Correct Aurora HTML plumbing and data sources"
            git push origin HEAD:main
          fi
